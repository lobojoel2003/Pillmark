version: 2
updates:
  - package-ecosystem: pip
    directory: /api
    schedule: { interval: weekly }
    groups:
      python:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/api, /web]
    schedule: { interval: weekly }
