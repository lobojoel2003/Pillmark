name: Release

# Push a tag (git tag v1.2.3 && git push origin v1.2.3), or run this workflow by hand
# to release the version in VERSION from the selected branch (the tag is created).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  PILLMARK_BUILD: ${{ github.run_number }}
  PILLMARK_COMMIT: ${{ github.sha }}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      owner: ${{ steps.version.outputs.owner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: version
        name: Check the version
        run: |
          version="$(python3 scripts/version.py show)"
          tag="v${version}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            python3 scripts/version.py check --tag "${GITHUB_REF_NAME}"
          else
            python3 scripts/version.py check
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::error::${tag} already exists. Bump VERSION (python3 scripts/version.py bump patch) first."
              exit 1
            fi
          fi
          case "${version}" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "prerelease=${prerelease}"
            echo "owner=${GITHUB_REPOSITORY_OWNER,,}"
          } >> "${GITHUB_OUTPUT}"
          echo "Releasing ${tag} (build ${PILLMARK_BUILD})" >> "${GITHUB_STEP_SUMMARY}"

  ci:
    name: CI
    needs: prepare
    uses: ./.github/workflows/ci.yml

  python:
    name: Python package
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build api --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-python
          path: dist/*
          retention-days: 7

  web:
    name: Web build
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm ci
          npm run build
      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/pillmark-web-${{ needs.prepare.outputs.version }}.tar.gz" -C web build package.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: dist/*
          retention-days: 7

  images:
    name: Image · ${{ matrix.app }}
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ needs.prepare.outputs.owner }}/pillmark-${{ matrix.app }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }},enable=${{ needs.prepare.outputs.prerelease == 'false' }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.tag }},enable=${{ needs.prepare.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease == 'false' }}
            type=raw,value=build-${{ github.run_number }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            BUILD=${{ github.run_number }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          provenance: mode=max
          sbom: true

  publish:
    name: GitHub release
    needs: [prepare, python, web, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * | tee SHA256SUMS.txt
      - name: Release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          OWNER: ${{ needs.prepare.outputs.owner }}
        run: |
          python3 scripts/version.py notes "${VERSION}" > notes.md
          cat >> notes.md <<NOTES

          ### Docker images

          \`\`\`bash
          docker pull ghcr.io/${OWNER}/pillmark-api:${VERSION}
          docker pull ghcr.io/${OWNER}/pillmark-web:${VERSION}
          \`\`\`

          ### Build

          Version ${VERSION}, build ${PILLMARK_BUILD}, commit ${GITHUB_SHA::7}. Verify downloads with \`SHA256SUMS.txt\`.
          NOTES
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          flags=()
          if [ "${PRERELEASE}" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "${TAG}" dist/* \
            --title "Pillmark ${VERSION}" \
            --notes-file notes.md \
            --target "${GITHUB_SHA}" \
            "${flags[@]}"
