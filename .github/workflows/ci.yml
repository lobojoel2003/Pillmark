name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  # Build number and commit, shown in the API (/v1/meta) and the web footer.
  PILLMARK_BUILD: ${{ github.run_number }}
  PILLMARK_COMMIT: ${{ github.sha }}

jobs:
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: VERSION, pyproject, __init__, package.json and CHANGELOG agree
        run: python3 scripts/version.py check

  api:
    name: API · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pillmark
          POSTGRES_PASSWORD: pillmark
          POSTGRES_DB: pillmark_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pillmark -d pillmark_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: api
    env:
      PILLMARK_TEST_DATABASE_URL: postgresql://pillmark:pillmark@localhost:5432/pillmark_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Format
        run: ruff format --check src tests
      - name: Type check
        run: mypy
      - name: Test
        run: pytest --cov --cov-report=term --cov-report=xml
      - name: Upload coverage
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: api/coverage.xml
          retention-days: 14

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Install Chromium for component tests
        run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Unit and component tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pillmark
          POSTGRES_PASSWORD: pillmark
          POSTGRES_DB: pillmark
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pillmark -d pillmark"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://pillmark:pillmark@localhost:5432/pillmark
      API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Install the API
        run: pip install ./api
      - name: Load test labels
        working-directory: api
        run: |
          python -m tests.e2e_fixture e2e.zip
          pillmark import file e2e.zip
      - name: Start the API
        run: |
          nohup uvicorn pillmark.api.app:app --port 8000 > api.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8000/v1/health && exit 0; sleep 1; done
          cat api.log; exit 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser tests (desktop and mobile)
        working-directory: web
        run: npx playwright test
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            api.log
          retention-days: 7

  docker:
    name: Docker images
    needs: [versions]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: api
          load: true
          tags: ghcr.io/lobojoel2003/pillmark-api:ci
          build-args: |
            VERSION=ci
            BUILD=${{ github.run_number }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: web
          load: true
          tags: ghcr.io/lobojoel2003/pillmark-web:ci
          build-args: |
            VERSION=ci
            BUILD=${{ github.run_number }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Smoke test with docker compose
        env:
          PILLMARK_TAG: ci
        run: |
          docker compose up -d --no-build --wait db api web
          (cd api && python3 -m tests.e2e_fixture /tmp/e2e.zip)
          docker compose cp /tmp/e2e.zip api:/tmp/e2e.zip
          docker compose exec -T api pillmark import file /tmp/e2e.zip
          curl -sf http://localhost:3000/healthz
          curl -sf http://localhost:8000/v1/meta | grep -q '"build":"${{ github.run_number }}"'
          curl -sf "http://localhost:3000/api/v1/pills?imprint=TEVA%203109" | grep -q Amoxicillin
          curl -sf "http://localhost:3000/?imprint=M367" | grep -q "Hydrocodone"
      - name: Logs
        if: failure()
        run: docker compose logs
