[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pillmark"
version = "1.0.0"
description = "Open pill identifier: DailyMed importer, Postgres fuzzy imprint search and a public FastAPI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Joel Stain Lobo" }]
keywords = ["pill identifier", "dailymed", "spl", "imprint", "fastapi", "postgres"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: FastAPI",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "httpx>=0.27,<1",
  "lxml>=5.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "lxml-stubs>=0.5",
]

[project.urls]
Homepage = "https://github.com/lobojoel2003/Pillmark"
Repository = "https://github.com/lobojoel2003/Pillmark"
Issues = "https://github.com/lobojoel2003/Pillmark/issues"
Changelog = "https://github.com/lobojoel2003/Pillmark/blob/main/CHANGELOG.md"

[project.scripts]
pillmark = "pillmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pillmark"]

[tool.hatch.build.targets.sdist]
include = ["src/pillmark", "tests", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["db: needs a PostgreSQL database (set PILLMARK_TEST_DATABASE_URL)"]
filterwarnings = [
  "error",
  "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.coverage.run]
source = ["pillmark"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "S", "PT", "RET", "TID"]
ignore = ["S101", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["pillmark"]
